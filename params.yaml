linear_regression:
  data_path: data/student_combined_cleaned.csv
  model_output: models/linear_regression_model.pkl
  test_size: 0.3
  random_state: 42
  plot_alpha: 0.6
  plot_figsize: [8, 6]
  plot_line_range: [0, 20]
  alpha: 1.0 #正则化超参数（L2）

decision_tree:
  data_path: data/student_combined_cleaned.csv
  model_output: models/decision_tree_model.pkl
  test_size: 0.3
  random_state: 42
  plot_figsize: [8, 6]
  plot_alpha: 0.6
  plot_line_range: [0, 20]
  min_samples_split: 2  # 最小样本分裂数
  min_samples_leaf: 1   # 最小样本叶子数
  max_features: "auto"  # 最大特征数
  max_depth: 10         # 控制树的最大深度

catboost:
  data_path: data/student_combined_cleaned.csv
  model_output: models/catboost_model.cbm
  importance_output: results/catboost_feature_importance_train.csv

  target: G3
  test_size: 0.3
  random_state: 42

  iterations: 1000 # 增加迭代次数
  learning_rate: 0.05 # 调整学习率
  depth: 6
  loss_function: RMSE
  verbose: 100

  categorical_features:
    - school
    - sex
    - address
    - famsize
    - Pstatus
    - Mjob
    - Fjob
    - reason
    - guardian
    - schoolsup
    - famsup
    - paid
    - activities
    - nursery
    - higher
    - internet
    - romantic
    - class

  plot_alpha: 0.6
  plot_figsize: [8, 6]
  plot_line_range: [0, 20]

xgboost:
  data_path: data/student_combined_cleaned.csv
  target: G3
  model_output: models/xgboost_model.json
  importance_plot_output: results/xgboost_feature_importance.png
  importance_plot_output_full: results/xgboost_feature_importance_full.png

  test_size: 0.3
  random_state: 42
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8  # 添加样本比例
  colsample_bytree: 0.8  # 添加特征比例

  plot_figsize: [12, 6]

nn:
  data_path: data/student_combined_cleaned.csv
  target: G3
  model_output: models/nn_model.pth
  train_data_output: 10/data/raw/nn_train_data.csv
  eval_data_output: 10/data/raw/nn_eval_data.csv
  loss_plot_output: 10/data/raw/nn_loss_curve.png
  feature_columns_output: 10/data/raw/nn_feature_columns.txt
  tensorboard_log_dir: runs/nn_experiment
  eval_metrics_output: results/nn_eval_result.txt
  eval_plot_output: results/nn_eval_plot.png

  eval_metrics_output_full: results/nn_eval_result_full.txt
  eval_plot_output_full: results/nn_eval_plot_full.png

  test_size: 0.3
  random_state: 42
  learning_rate: 0.001
  epochs: 100
  batch_size: 32   # 添加批次大小
  dropout: 0.2     # 添加dropout比例

  plot_alpha: 0.6
  plot_figsize: [8, 6]
  plot_line_range: [0, 20]